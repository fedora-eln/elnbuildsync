apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.app_name }}
  name: {{ .Values.app_name }}
  namespace: {{ .Values.oc_namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.app_name }}
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ .Values.app_name }}
    spec:
      {{- if .Values.sidecar_database }}
      # Optional Postgres sidecar: TESTING/DEVELOPMENT only — not for production.
      # Runs as a Kubernetes 1.31+ native sidecar initContainer so the app starts after Postgres.
      initContainers:
      - name: postgres
        restartPolicy: Always
        {{- include "elnbuildsync.postgresContainerBody" . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.app_name }}
        image: {{ .Values.image.repo }}:{{ .Values.image.tag }}
        startupProbe:
          httpGet:
            path: {{ .Values.health_checks.startup_probe.path }}
            port: {{ .Values.health_checks.startup_probe.port }}
          failureThreshold: {{ .Values.health_checks.startup_probe.failure_threshold }}
          periodSeconds: {{ .Values.health_checks.startup_probe.period_seconds }}
        livenessProbe:
          httpGet:
            path: {{ .Values.health_checks.liveness_probe.path }}
            port: {{ .Values.health_checks.liveness_probe.port }}
          initialDelaySeconds: {{ .Values.health_checks.liveness_probe.initial_delay_seconds }}
          periodSeconds: {{ .Values.health_checks.liveness_probe.period_seconds }}
          timeoutSeconds: {{ .Values.health_checks.liveness_probe.timeout_seconds }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /keytab
          name: keytab
        # DB password and optional elnbuildsync_config.yaml
        - mountPath: /etc/elnbuildsync
          name: ebs-config
        - mountPath: /etc/fedora-messaging
          name: fedora-messaging-config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: keytab
        secret:
          defaultMode: 420
          secretName: keytab
      - name: ebs-config
        secret:
          defaultMode: 420
          secretName: ebs-config
      - name: fedora-messaging-config
        secret:
          defaultMode: 420
          secretName: fedora-messaging-config
      {{- if .Values.sidecar_database }}
      # postgres-data: backing store for the testing-only Postgres sidecar (see initContainers).
      - name: postgres-data
        {{- if .Values.sidecar_database_persistent }}
        persistentVolumeClaim:
          claimName: {{ .Values.app_name }}-postgres-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
