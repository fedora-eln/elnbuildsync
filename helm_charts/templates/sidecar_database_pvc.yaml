{{- if and .Values.sidecar_database .Values.sidecar_database_persistent }}
# PVC for the optional Postgres TESTING sidecar only—not for production workloads.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.app_name }}-postgres-data
  namespace: {{ .Values.oc_namespace }}
  labels:
    app: {{ .Values.app_name }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sidecar_database_postgres.persistence.size | quote }}
  {{- with .Values.sidecar_database_postgres.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
