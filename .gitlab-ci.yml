stages:
  - lint
  - test
  - build_image
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PROJECT_NAME: elnbuildsync
  # OC_PROJECT_NAME: The project name to deploy to on OpenShift
  # OC_SERVER: The server URL to deploy to on OpenShift
  # OC_TOKEN: The token to deploy to on OpenShift
  # OC_USER: The user to deploy to on OpenShift
  # OC_PASSWORD: The password to deploy to on OpenShift
  # OC_NAMESPACE: The namespace to deploy to on OpenShift
  # OC_IMAGE_STREAM: The image stream to deploy to on OpenShift
  # OC_IMAGE_TAG: The image tag to deploy to on OpenShift

.base_ruff:
  stage: lint
  interruptible: true
  image: ghcr.io/astral-sh/ruff:alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version


Ruff Check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json


Ruff Format:
  extends: .base_ruff
  script:
    - ruff format --diff


flake8:
  stage: lint
  image: python:3.14-alpine
  script:
    - pip install flake8-gl-codeclimate
    - flake8 --version
    - |
      flake8 --exit-zero --format gl-codeclimate --extend-ignore=E501 \
             --output-file $CI_PROJECT_DIR/gl-code-quality-report.json \
             $CI_PROJECT_DIR
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/gl-code-quality-report.json


# Read project version from pyproject.toml and expose it to downstream jobs
project_version:
  stage: lint
  image: python:3.14-alpine
  script:
    - export VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
    - printf 'VERSION=%s\n' "$VERSION" > version.env
    - 'echo "Version: $VERSION"'
  artifacts:
    reports:
      dotenv: version.env


# Confirm that the version in pyproject.toml matches the tag being set
version_check:
  stage: lint
  needs:
    - job: project_version
  image: python:3.14-alpine
  script:
    - 'echo "Version: $VERSION"'
    - 'echo "Tag: $CI_COMMIT_TAG"'
    - |
      if [ "$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "Version in pyproject.toml does not match tag"
        echo "Make sure to update the metadata before trying to deploy"
        exit 1
      else
        echo "Version in pyproject.toml matches tag"
      fi
  rules:
    - if: $CI_COMMIT_TAG


image_build:
  stage: build_image
  needs:
    - job: project_version
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    IMAGE_TAG: ${VERSION}-${CI_PIPELINE_IID}
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --skip-tls-verify --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination ${CI_REGISTRY_IMAGE}/${PROJECT_NAME}:${IMAGE_TAG}
